# Primary hybrid profile: Jev makes bounded decisions; Sol/Astra use ChatGPT sign-in.
# OPENAI_API_KEY is neither required nor inherited by the Codex child process.
[providers]
openai_backend = "chatgpt"
codex_binary = "auto"
codex_timeout_seconds = 180

[subscription]
max_subscription_calls = 20
max_subscription_astra_calls = 2

# Defaults are intentionally offline. Live calls require --live and project consent.
[execution]
max_context_bytes = 24000
max_output_tokens = 2048
timeout_seconds = 45

[budgets]
max_single_call_microusd = 250000
max_astra_microusd = 1000000
approval_above_microusd = 100000

[routing]
assessment_provider = "jev"
confidence_threshold = 0.80
sol_max_attempts = 2
astra_max_attempts = 1
astra_triggers = ["high_risk", "architecture", "security", "irreversible", "very_high_complexity", "repeated_failure"]

[models.jev]
id = "jev-latest"
# Verified 2026-09-29: Jev 1.13 is $0.042/M input tokens; output is free.
input_per_million = "0.042"
output_per_million = "0"
cached_per_million = "0.042"

[models.sol]
id = "gpt-6-sol"
input_per_million = ""
output_per_million = ""
cached_per_million = ""

[models.astra]
id = "gpt-6-astra"
input_per_million = ""
output_per_million = ""
cached_per_million = ""
